<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <header>
        <nav class="navbar">

            <a href="index.html" class="logo">AETERNA</a>

            <div class="nav-menu">
                <a href="index.html">Home</a>
                <a href="katalog.html" class="active">Film</a>
                <a href="watchlist.html">Watchlist</a>
            </div>

            <div class="nav-actions">

                <label for="navSearch" class="sr-only">
                    Cari film
                </label>

                <input
                    type="text"
                    id="navSearch"
                    placeholder="Cari film..."
                >

            </div>

        </nav>
    </header>

    <main>
        
        <section class="catalog-section">

            <h1>FILM</h1>

            <p class="catalog-description">
                Temukan film yang ingin kamu tonton.
            </p>

            <div class="catalog-controls">

                <label for="searchFilm" class="sr-only">
                    Cari film
                </label>

                <input
                    type="text"
                    id="searchFilm"
                    placeholder="Cari film..."
                >


                <label for="genreFilter" class="sr-only">
                    Pilih genre
                </label>

                <select id="genreFilter">
                    <option value="all">Semua Genre</option>
                    <option value="Animation">Animation</option>
                    <option value="Adventure">Adventure</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Action">Action</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Drama">Drama</option>
                    <option value="Family">Family</option>
                </select>


                <label for="ratingSort" class="sr-only">
                    Urutkan rating
                </label>

                <select id="ratingSort">
                    <option value="default">Rating</option>
                    <option value="high">Rating Tertinggi</option>
                    <option value="low">Rating Terendah</option>
                </select>

            </div>

            <div class="film-grid" id="catalogFilms"></div>

        </section>

    </main>

    <footer class="footer">

        <div>
            <h3>AETERNA</h3>

            <p>
                Temukan film favoritmu di Aeterna.
            </p>
        </div>


        <div class="footer-links">

            <a href="index.html">Home</a>
            <a href="katalog.html">Film</a>
            <a href="watchlist.html">Watchlist</a>

        </div>


        <p class="copyright">
            © 2026 Aeterna. All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>
</body>
</html>
