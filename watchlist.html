<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeterna - Watchlist</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">
                AETERNA
            </a>

            <div class="nav-menu">
                <a href="index.html">Home</a>
                <a href="katalog.html">Film</a>
                <a href="watchlist.html" class="active">
                    Watchlist
                </a>
            </div>

            <div class="nav-actions">
                <label for="navSearch" class="sr-only">
                    Cari film
                </label>

                <input
                    type="text"
                    id="navSearch"
                    placeholder="Cari film..."
                >
            </div>

        </nav>
    </header>


    <main>

        <section class="watchlist-section">

            <h1>WATCHLIST</h1>

            <p class="watchlist-description">

            <p class="watchlist-count" id="watchlistCount">
                0 Film
            </p>

            <div
                class="film-grid"
                id="watchlistFilms">
            </div>

        </section>

    </main>

    <footer class="footer">

        <div>
            <h3>AETERNA</h3>

                Temukan film favoritmu di Aeterna.

        </div>

        <div class="footer-links">
            <a href="index.html">Home</a>
