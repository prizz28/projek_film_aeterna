<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeterna - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">AETERNA</a>

            <div class="nav-menu">
                <a href="index.html" class="active">Home</a>
                <a href="katalog.html">Film</a>
                <a href="watchlist.html">Watchlist</a>
            </div>

            <div class="nav-actions">

                <label for="navSearch" class="sr-only">
                    Cari film
                </label>

                <input type="text" id="navSearch" placeholder="Cari film...">

            </div>

        </nav>
    </header>

    <main>

        <section class="hero">

            <div class="hero-content">

                <h1>THE LAST HORIZON</h1>

                <div class="hero-info">
                    <span class="rating">★ 8.7</span>
                    <span>2026</span>
                    <span>2h 15m</span>
                </div>

                <p>
                    Sebuah perjalanan penuh misteri dimulai ketika seorang
                    pengembara menemukan rahasia yang tersembunyi di balik
                    kota yang telah lama ditinggalkan.
                </p>

                <div class="hero-buttons">

                    <a href="detail.html" class="btn-primary">
                        Watch Trailer
                    </a>

                    <button
                        class="btn-secondary"
                        id="heroWatchlist"
                    >
                        + Watchlist
                    </button>

                </div>

            </div>

        </section>
</body>
</html>
